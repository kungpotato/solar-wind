<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Agent pay-per-call flow on Arc using client-broadcast x402 (no facilitator)</title>
<desc>An AI agent calls a paid API, receives a 402 Payment Required response with a USDC price, signs and broadcasts its own EIP-3009 payment transaction directly to Arc mainnet, Arc mainnet confirms the USDC transfer, then the resource server verifies the transaction and returns the requested data.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .title-purple { fill: #3C3489; }
  .sub-purple { fill: #534AB7; }
  .title-teal { fill: #085041; }
  .sub-teal { fill: #0F6E56; }
  .title-coral { fill: #712B13; }
  .sub-coral { fill: #993C1D; }
  text { font-family: sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>

<rect class="box-purple" x="180" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-purple" x="340" y="58" text-anchor="middle" dominant-baseline="central">AI agent</text>
<text class="ts sub-purple" x="340" y="78" text-anchor="middle" dominant-baseline="central">Calls the paid Arc API</text>

<line x1="340" y1="96" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="180" y="146" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-teal" x="340" y="164" text-anchor="middle" dominant-baseline="central">Arc resource server</text>
<text class="ts sub-teal" x="340" y="184" text-anchor="middle" dominant-baseline="central">Replies 402 + USDC price</text>

<line x1="340" y1="202" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>

<rect class="box-purple" x="180" y="252" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-purple" x="340" y="270" text-anchor="middle" dominant-baseline="central">AI agent</text>
<text class="ts sub-purple" x="340" y="290" text-anchor="middle" dominant-baseline="central">Signs &amp; broadcasts EIP-3009 tx</text>

<line x1="340" y1="308" x2="340" y2="358" class="arr" marker-end="url(#arrow)"/>

<rect class="box-coral" x="180" y="358" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-coral" x="340" y="376" text-anchor="middle" dominant-baseline="central">Arc mainnet</text>
<text class="ts sub-coral" x="340" y="396" text-anchor="middle" dominant-baseline="central">Confirms the USDC transfer</text>

<line x1="340" y1="414" x2="340" y2="464" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="180" y="464" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-teal" x="340" y="482" text-anchor="middle" dominant-baseline="central">Arc resource server</text>
<text class="ts sub-teal" x="340" y="502" text-anchor="middle" dominant-baseline="central">Verifies tx &amp; returns data</text>
</svg>
