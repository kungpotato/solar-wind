<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Risk Score API · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Arc Risk Score API — request and payment sequence</h1>

    <svg viewBox="0 0 940 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-sequence-title api-sequence-desc">
      <title id="api-sequence-title">Arc Risk Score API request/payment sequence</title>
      <desc id="api-sequence-desc">Sequence diagram showing an agent calling the Arc Risk Score API, receiving a 402 payment challenge, broadcasting its own payment directly on Arc mainnet with no facilitator, then retrying the call with proof of payment to receive a risk score.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ==========================================================
           LIFELINES — Client 150, API Server 470, Arc mainnet 790
           ========================================================== -->
      <line x1="150" y1="128" x2="150" y2="596" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="470" y1="128" x2="470" y2="596" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="790" y1="128" x2="790" y2="596" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ==========================================================
           ACTIVATION BARS
           ========================================================== -->
      <!-- API Server, phase 1: receive unpaid call, reply 402 -->
      <rect x="466" y="180" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Arc mainnet, phase 1: broadcast + confirm payment -->
      <rect x="786" y="292" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- API Server, phase 2: receive paid call, verify on Arc, respond 200 -->
      <rect x="466" y="404" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Arc mainnet, phase 2: verify tx (RPC read), nested inside API's phase-2 activation -->
      <rect x="786" y="460" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ==========================================================
           MESSAGE ARROWS — time flows top → down
           ========================================================== -->
      <!-- M1: Client → API Server (call · link) -->
      <line x1="150" y1="176" x2="470" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2: API Server → Client (return · dashed muted) -->
      <line x1="470" y1="232" x2="150" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M3: Client → Arc mainnet (call · link) -->
      <line x1="150" y1="288" x2="790" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M4: Arc mainnet → Client (return · dashed muted) -->
      <line x1="790" y1="344" x2="150" y2="344" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M5: Client → API Server (call · link) -->
      <line x1="150" y1="400" x2="470" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M6: API Server → Arc mainnet (call · link, nested) -->
      <line x1="470" y1="456" x2="790" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M7: Arc mainnet → API Server (return · dashed muted) -->
      <line x1="790" y1="512" x2="470" y2="512" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M8: API Server → Client (headline success · solid coral) -->
      <line x1="470" y1="568" x2="150" y2="568" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ==========================================================
           MESSAGE LABELS — masked, 6–10px clear of each connector
           ========================================================== -->
      <!-- M1 -->
      <rect x="269" y="156" width="82" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="166" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /RISK</text>
      <!-- M2 -->
      <rect x="255" y="212" width="110" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">402 · PAY REQ</text>
      <!-- M3 -->
      <rect x="418" y="268" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="278" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROADCAST TX</text>
      <!-- M4 -->
      <rect x="418" y="324" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TX CONFIRMED</text>
      <!-- M5 -->
      <rect x="255" y="380" width="110" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="390" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET + PAYMENT</text>
      <!-- M6 -->
      <rect x="588" y="436" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="446" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY TX</text>
      <!-- M7 -->
      <rect x="588" y="492" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TX VALID</text>
      <!-- M8 -->
      <rect x="262" y="548" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="558" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · SCORE</text>

      <!-- ==========================================================
           ACTOR BOXES — drawn after arrows/labels
           ========================================================== -->
      <!-- Client (external caller) -->
      <rect x="78" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="78" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="86" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="100" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="150" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="150" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">demo.ts agent</text>

      <!-- API Server (focal) -->
      <rect x="398" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="398" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="406" y="80" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="421" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="470" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Server</text>
      <text x="470" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cloudflare Worker</text>

      <!-- Arc mainnet (external chain) -->
      <rect x="718" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="718" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="726" y="80" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="741" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RPC</text>
      <text x="790" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Arc mainnet</text>
      <text x="790" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chain 5042</text>

      <!-- ==========================================================
           LEGEND
           ========================================================== -->
      <line x1="78" y1="612" x2="862" y2="612" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="78" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="78" y1="652" x2="106" y2="652" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="112" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL (HTTP / RPC)</text>

      <line x1="298" y1="652" x2="326" y2="652" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="332" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

      <line x1="478" y1="652" x2="506" y2="652" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="512" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SUCCESS RESPONSE</text>

      <rect x="678" y="646" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="698" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL SERVICE</text>
    </svg>
  </div>
</body>
</html>
