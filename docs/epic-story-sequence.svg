<svg width="100%" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Epic sequence: Arc pay-per-call risk score API, stories 1 through 6</title>
<desc>The provider deploys and prices the API, an AI agent calls it and receives a 402, the agent pays by broadcasting a signed transaction, Arc mainnet confirms the payment verifiably, the agent receives a risk score computed from real on-chain data, and a grant reviewer opens the repo and sees the whole loop work end to end.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; }
  .title-teal { fill: #085041; } .sub-teal { fill: #0F6E56; }
  .title-purple { fill: #3C3489; } .sub-purple { fill: #534AB7; }
  .title-coral { fill: #712B13; } .sub-coral { fill: #993C1D; }
  text { font-family: sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
</style>

<rect class="box-teal" x="180" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-teal" x="340" y="58" text-anchor="middle" dominant-baseline="central">Provider (us)</text>
<text class="ts sub-teal" x="340" y="78" text-anchor="middle" dominant-baseline="central">Deploys &amp; prices the API</text>

<line x1="340" y1="96" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>

<rect class="box-purple" x="180" y="140" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-purple" x="340" y="158" text-anchor="middle" dominant-baseline="central">AI agent</text>
<text class="ts sub-purple" x="340" y="178" text-anchor="middle" dominant-baseline="central">Calls &amp; receives 402</text>

<line x1="340" y1="196" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect class="box-purple" x="180" y="240" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-purple" x="340" y="258" text-anchor="middle" dominant-baseline="central">AI agent</text>
<text class="ts sub-purple" x="340" y="278" text-anchor="middle" dominant-baseline="central">Pays via signed on-chain tx</text>

<line x1="340" y1="296" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect class="box-coral" x="180" y="340" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-coral" x="340" y="358" text-anchor="middle" dominant-baseline="central">Arc mainnet</text>
<text class="ts sub-coral" x="340" y="378" text-anchor="middle" dominant-baseline="central">Confirms payment, verifiable</text>

<line x1="340" y1="396" x2="340" y2="440" class="arr" marker-end="url(#arrow)"/>

<rect class="box-purple" x="180" y="440" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-purple" x="340" y="458" text-anchor="middle" dominant-baseline="central">AI agent</text>
<text class="ts sub-purple" x="340" y="478" text-anchor="middle" dominant-baseline="central">Gets risk score from real data</text>

<line x1="340" y1="496" x2="340" y2="540" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="180" y="540" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th title-teal" x="340" y="558" text-anchor="middle" dominant-baseline="central">Grant reviewer</text>
<text class="ts sub-teal" x="340" y="578" text-anchor="middle" dominant-baseline="central">Opens repo link, sees it work</text>
</svg>
